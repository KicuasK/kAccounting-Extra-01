[package]
name = "kaccounting-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
aead-stream = { version = "0.6.0", features = ["alloc"] }
axum = { version = "0.8.9", default-features = false, features = ["json", "http1", "tokio"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
renamore = "0.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
hpke = { version = "0.13", default-features = false, features = ["x25519", "std"] }
rand_chacha = "0.9"
zeroize = "1.8.2"

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", default-features = false, features = ["OSX_10_15"] }
core-foundation = "0.10.1"
